#Common
server.port=8080

#Database
# spring.datasource.url=jdbc:mysql://localhost:3306/velorentdb?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/velorentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Security
#spring.security.user.name=admin
#spring.security.user.password=admin123
server.servlet.session.timeout=30m

# Authentication
app.auth.enabled=true

# Development only
app.password.encrypted=false

# Production must change to:
# app.password.encrypted=true